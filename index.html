const sceneAssets={
  deep:new Image(),
  silica:new Image(),
  structure:new Image(),
  flow:new Image(),
  detector:new Image()
};
const sceneAssetSources={
  deep:'assets/column-deep.png',
  silica:'assets/silica-back.png',
  structure:'assets/column-structure.png',
  flow:'assets/flow-channel.png',
  detector:'assets/detector-uv-vis.png'
};
let assetsReady=false;
Promise.all(Object.entries(sceneAssets).map(([key,img])=>new Promise((resolve,reject)=>{
  img.onload=resolve;img.onerror=reject;img.src=sceneAssetSources[key];
}))).then(()=>assetsReady=true).catch(()=>assetsReady=false);


function reset(){
 lane=1;targetX=lanes[1];distance=0;boost=0;item=null;itemCount=0;elapsed=0;score=0;finished=false;
 rivals=[{name:'Captain Caffeine',lane:0,z:.72,speed:.27,color:'#ff7b31'},
 {name:'Lady Paraben',lane:2,z:.52,speed:.30,color:'#ff4f9a'},
 {name:'Aroma',lane:1,z:.86,speed:.285,color:'#64d9ff'}];
 obstacles=[{lane:0,z:.25,type:'silica'},{lane:2,z:.43,type:'impurity'},
 {lane:1,z:.66,type:'molecule'},{lane:0,z:.86,type:'solvent'},{lane:2,z:1.03,type:'silica'}];
 molecules=[{lane:1,z:.18,c:'#ffd447'},{lane:0,z:.50,c:'#5de5ff'},
 {lane:2,z:.72,c:'#43c95a'},{lane:1,z:.93,c:'#ff6f61'}];
}
function useItem(){
 if(!itemCount||finished)return;
 itemCount--;
 if(item==='BOOST'){boost=2.2;item=null}
 else if(item==='ATTACK'){
   item=null;
   const r=rivals.find(x=>x.lane===lane&&x.z>.35&&x.z<.9);
   if(r)r.z-=.18;
 }
}
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'){lane=Math.max(0,lane-1);targetX=lanes[lane];started=true}
 if(e.key==='ArrowRight'){lane=Math.min(2,lane+1);targetX=lanes[lane];started=true}
 if(e.code==='Space'){started=true;useItem()}
 if(e.key.toLowerCase()==='r'){reset();started=true}
});
canvas.addEventListener('pointerdown',()=>started=true);

function moveLane(dir){
  lane=Math.max(0,Math.min(2,lane+dir));
  targetX=lanes[lane];
  started=true;
}
document.getElementById('leftBtn').addEventListener('pointerdown',e=>{e.preventDefault();moveLane(-1)});
document.getElementById('rightBtn').addEventListener('pointerdown',e=>{e.preventDefault();moveLane(1)});
document.getElementById('itemBtn').addEventListener('pointerdown',e=>{e.preventDefault();started=true;useItem()});

let touchStartX=0,touchStartY=0;
canvas.addEventListener('touchstart',e=>{
  if(!e.touches.length)return;
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  started=true;
},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>35 && Math.abs(dx)>Math.abs(dy)*1.15) moveLane(dx>0?1:-1);
},{passive:true});

function laneX(l,z){return 480+(lanes[l]-480)*(.18+.82*Math.max(0,Math.min(1,z)))}
function laneY(z){return 145+370*Math.max(0,Math.min(1,z))}
function roadHalf(z){return 70+390*Math.max(0,Math.min(1,z))}

function drawBackground(){
  // Real art layers: deep column -> silica -> detector -> flow -> structure.
  // Gameplay remains unchanged; only the visual environment is replaced.
  ctx.fillStyle='#07101f';ctx.fillRect(0,0,W,H);
  if(!assetsReady){
    ctx.fillStyle='#07101f';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#5de5ff';ctx.font='16px monospace';ctx.textAlign='center';
    ctx.fillText('CARREGANDO COLUNA...',W/2,H/2);ctx.textAlign='left';
    return;
  }

  ctx.save();
  ctx.imageSmoothingEnabled=false;

  // Layer 4 — deep interior.
  ctx.drawImage(sceneAssets.deep,0,0,W,H);

  // Layer 3 — porous silica stationary phase.
  ctx.drawImage(sceneAssets.silica,0,0,W,H);

  // Detector: distant target at the end of the column.
  const progress=Math.max(0,Math.min(1,distance/500));
  const detectorScale=.42+progress*.48;
  const dw=640*detectorScale, dh=420*detectorScale;
  ctx.globalAlpha=.72+.28*progress;
  ctx.drawImage(sceneAssets.detector,480-dw/2,38-progress*4,dw,dh);
  ctx.globalAlpha=1;

  // Layer 1 — mobile-phase flow.
  // The asset supplies the visual channel; animated streaks below reinforce motion.
  ctx.drawImage(sceneAssets.flow,0,0,W,H);

  // Flow motion overlay, kept inside the three playable channels.
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<34;i++){
    const z=(i*.071+elapsed*(.62+(i%4)*.08))%1;
    const y=145+z*395;
    const laneI=i%3;
    const x=laneX(laneI,z)+(i%2?-1:1)*(3+z*9);
    const len=3+z*20;
    ctx.strokeStyle=i%7===0?'rgba(255,212,71,.68)':'rgba(93,229,255,.55)';
    ctx.lineWidth=Math.max(1,Math.round(1+z*2));
    ctx.beginPath();ctx.moveTo(x,y-len);ctx.lineTo(x,y);ctx.stroke();
  }
  ctx.restore();

  // Layer 2 — column structure goes on top of the flow edges.
  ctx.drawImage(sceneAssets.structure,0,0,W,H);

  // Subtle optical glow toward the detector.
  const glow=ctx.createRadialGradient(480,148,8,480,190,360);
  glow.addColorStop(0,'rgba(93,229,255,.16)');
  glow.addColorStop(.5,'rgba(40,120,200,.05)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,70,W,H-70);

  ctx.restore();
}

function drawMolecules(){
  molecules.forEach(m=>{
    m.z+=.23/60;if(m.z>1.1)m.z=-.08;
    const x=laneX(m.lane,m.z),y=laneY(m.z),r=4+12*m.z;
    const alpha=.35+.65*m.z;
    ctx.save();ctx.globalAlpha=alpha;

    // Flow trail: molecules are carried by the mobile phase.
    ctx.strokeStyle=m.c;ctx.lineWidth=Math.max(1,Math.round(2*m.z));
    ctx.beginPath();ctx.moveTo(x,y-r*3.8);ctx.lineTo(x,y-r);ctx.stroke();
    ctx.strokeStyle='rgba(245,247,250,.72)';ctx.lineWidth=Math.max(1,Math.round(1+2*m.z));
    const a=r;
    ctx.beginPath();ctx.moveTo(x-a*1.7,y-a*.8);ctx.lineTo(x-a*.45,y);ctx.lineTo(x+a*1.4,y-a*.6);ctx.moveTo(x-a*.45,y);ctx.lineTo(x+.15*a,y+a*1.25);ctx.stroke();
    ctx.shadowColor=m.c;ctx.shadowBlur=7+10*m.z;
    ctx.fillStyle=m.c;ctx.beginPath();ctx.arc(x,y,r*.72,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f5f7fa';ctx.beginPath();ctx.arc(x-a*1.7,y-a*.8,r*.28,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=m.c;ctx.beginPath();ctx.arc(x+a*1.4,y-a*.6,r*.42,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
    if(m.z>.83&&m.lane===lane){item='BOOST';itemCount=1;score+=25;m.z=-.2}
  });
}

function drawObstacle(o){
  o.z+=.32/55;if(o.z>1.12){o.z=-.12;o.lane=Math.floor(Math.random()*3)}
  const x=laneX(o.lane,o.z),y=laneY(o.z),s=10+27*o.z;
  ctx.save();ctx.translate(x,y);ctx.lineJoin='round';ctx.strokeStyle='#0a1222';ctx.lineWidth=3;
  if(o.type==='silica'){
    // Irregular silica aggregate / stationary-phase blockage.
    ctx.fillStyle='#6e72c9';ctx.shadowColor='#5de5ff';ctx.shadowBlur=5;
    const pts=[[-1.15,.05],[-.72,-.9],[-.05,-1.22],[.85,-.7],[1.18,.15],[.55,1.02],[-.52,.92]];
    ctx.beginPath();pts.forEach((p,i)=>{const px=p[0]*s*.78,py=p[1]*s*.78;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle='#d9368a';ctx.fillRect(-s*.34,-s*.18,s*.16,s*.16);ctx.fillStyle='#43c95a';ctx.fillRect(s*.12,s*.16,s*.20,s*.20);
  } else if(o.type==='impurity'||o.type==='molecule'){
    // Large interfering molecule / substance cluster.
    const c=o.type==='impurity'?'#d9368a':'#43c95a';
    ctx.strokeStyle='rgba(245,247,250,.85)';ctx.lineWidth=Math.max(2,s*.08);
    ctx.beginPath();ctx.moveTo(-s*.85,-s*.35);ctx.lineTo(-s*.25,0);ctx.lineTo(s*.55,-s*.5);ctx.moveTo(-s*.25,0);ctx.lineTo(s*.2,s*.7);ctx.stroke();
    ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=10;
    [[-.85,-.35,.22],[-.25,0,.34],[.55,-.5,.30],[.2,.7,.24]].forEach(a=>{ctx.beginPath();ctx.arc(a[0]*s,a[1]*s,a[2]*s,0,Math.PI*2);ctx.fill()});
    ctx.shadowBlur=0;
  } else if(o.type==='solvent'){
    // Solvent bubble / concentration disturbance.
    ctx.strokeStyle='#5de5ff';ctx.fillStyle='rgba(93,229,255,.22)';ctx.shadowColor='#5de5ff';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(-s*.35,-s*.3,s*.18,0,Math.PI*2);ctx.fillStyle='#f5f7fa';ctx.fill();ctx.shadowBlur=0;
  }
  ctx.restore();
}

function drawRival(r){
  r.z+=r.speed/70;if(r.z>1.08){r.z=-.15;r.lane=Math.floor(Math.random()*3)}
  const x=laneX(r.lane,r.z),y=laneY(r.z)-18*r.z,s=10+18*r.z;
  ctx.save();ctx.translate(x,y);ctx.fillStyle=r.color;ctx.strokeStyle='#11172b';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,-s*.8,s*.62,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#f5f7fa';ctx.fillRect(-s*.55,-s*.1,s*1.1,s*1.1);
  ctx.fillStyle=r.color;ctx.fillRect(-s*.75,s*.2,s*.35,s*.7);ctx.fillRect(s*.4,s*.2,s*.35,s*.7);ctx.restore();
}
function drawVita(){
  const x=targetX,y=418,frame=Math.floor(elapsed*12)%8;
  // Slight glow keeps Vita C readable against the cool column interior.
  ctx.save();ctx.shadowColor='rgba(255,179,71,.35)';ctx.shadowBlur=7;
  ctx.drawImage(sprite,frame*64,0,64,64,x-48,y-72,96,96);ctx.restore();
}

function drawHUD(){
 ctx.fillStyle='rgba(7,13,27,.88)';ctx.fillRect(16,14,W-32,56);
 ctx.strokeStyle='rgba(93,229,255,.35)';ctx.lineWidth=2;ctx.strokeRect(16,14,W-32,56);
 ctx.fillStyle='#ffd447';ctx.font='bold 20px monospace';ctx.fillText('CHROMARACERS',30,39);
 ctx.fillStyle='#f5f7fa';ctx.font='16px monospace';
 ctx.fillText('DIST '+Math.floor(distance).toString().padStart(3,'0')+' m',330,39);
 ctx.fillText('POS '+(1+rivals.filter(r=>r.z<.82).length)+'/4',510,39);
 ctx.fillStyle='#5de5ff';ctx.fillText('ITEM '+(itemCount?item:'—'),675,39);
 ctx.fillStyle=boost>0?'#ffb347':'#9ba8c8';ctx.fillText('SPD '+(boost>0?'BOOST':'RUN'),800,39);
}

function drawStart(){
 ctx.fillStyle='rgba(7,10,20,.82)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
 ctx.fillStyle='#ffd447';ctx.font='bold 42px monospace';ctx.fillText('VITAMIN RUSH',W/2,220);
 ctx.fillStyle='#fff';ctx.font='18px monospace';ctx.fillText('CORRA DENTRO DA COLUNA CROMATOGRÁFICA',W/2,258);
 ctx.fillStyle='#5de5ff';ctx.fillText('← → / DESLIZE    ITEM: BOTÃO',W/2,302);
 ctx.fillStyle='#9ba8c8';ctx.font='14px monospace';ctx.fillText('Toque ou pressione uma tecla para começar',W/2,345);ctx.textAlign='left';
}
function loop(t){
 const dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;
 if(started&&!finished){
  elapsed+=dt;distance+=dt*(boost?95:55);if(boost>0)boost-=dt;
  if(distance>=500){distance=500;finished=true}
  targetX+=(lanes[lane]-targetX)*Math.min(1,dt*12);
 }
 drawBackground();drawRoad();drawMolecules();obstacles.forEach(drawObstacle);rivals.forEach(drawRival);drawVita();drawHUD();
 if(!started)drawStart();
 if(finished){ctx.fillStyle='rgba(7,10,20,.78)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ffd447';ctx.font='bold 38px monospace';ctx.fillText('CHEGADA AO DETECTOR!',W/2,245);ctx.fillStyle='#fff';ctx.font='18px monospace';ctx.fillText('PONTUAÇÃO '+(score+Math.floor(distance)),W/2,285);ctx.fillText('Pressione R para correr novamente',W/2,325);ctx.textAlign='left'}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
